name: Windows

on:
  pull_request:
  release:
    types: [published]
  push:
    tags:
    branches:
      - main


env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # covdbg identifies this repository by the job's OIDC token

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-${{ github.workflow }}-${{ env.BUILD_TYPE }}-${{ hashFiles('**/CMakeLists.txt') }}-${{ hashFiles('./vcpkg.json')}}
          restore-keys: |
            ${{ runner.os }}-${{ env.BUILD_TYPE }}-
          path: |
            ./vcpkg
            ~/vcpkg
            ./build/vcpkg_installed
            ${{ env.HOME }}/.cache/vcpkg/archives
            ${{ env.XDG_CACHE_HOME }}/vcpkg/archives
            ${{ env.LOCALAPPDATA }}\vcpkg\archives
            ${{ env.APPDATA }}\vcpkg\archives
            "**/cpm_modules"

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          vcvarsall: true
          cmake: true
          ninja: true
          conan: false
          vcpkg: true
          ccache: true
          clangtidy: false
          cppcheck: true
          gcovr: false
          opencppcoverage: false

      # GitHub issues no OIDC token to pull requests from forks, so coverage is measured on
      # pushes and on pull requests from branches of this repository.
      - name: Install covdbg
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          $zip = "$env:RUNNER_TEMP\covdbg-1.5.1-x64.zip"
          Invoke-WebRequest -Uri https://downloads.covdbg.com/covdbg-1.5.1-x64.zip -OutFile $zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne '82cb3352ae3e329faef2648e7574b99685312b90f6d255a8fd8bb58e6d96c4f5') { throw "covdbg-1.5.1-x64.zip: SHA-256 mismatch" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\covdbg"
          echo "$env:RUNNER_TEMP\covdbg" >> $env:GITHUB_PATH

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=C:\Users\runneradmin\vcpkg\scripts\buildsystems\vcpkg.cmake

      - name: Build
        run: cmake --build build --config Debug -j4

      - name: Test
        working-directory: ./build
        run: |
          ctest --build-config Debug

      - name: Test and coverage
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: ./build
        run: |
          covdbg --config ../.covdbg.yaml --output coverage.covdb --follow-children --propagate-exit-code ctest --build-config Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          covdbg convert --input coverage.covdb --format COBERTURA --output coverage.xml

      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows
          path: build/coverage.xml
